[package]
name = "ghostty-studio"
version = "0.4.0"
description = "A visual Ghostty configurator that respects your config file"
authors = ["SteinsHead"]
license = "MIT"
repository = "https://github.com/SteinsHead/ghostty-studio"
homepage = "https://steinshead.github.io/ghostty-studio/"
readme = "../README.md"
edition = "2021"
rust-version = "1.97.1"

[lib]
name = "ghostty_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
fs2 = "0.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.7.2"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
pretty_assertions = "1"
